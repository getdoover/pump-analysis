[project]
name = "pump-analysis-common"
version = "0.1.0"
description = "Shared maths core, config, tags and UI for the pump-analysis apps"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pump_analysis_common"]
