[project]
name = "pump-analysis"
version = "0.1.0"
description = "Pump performance & cavitation analysis: pressures + speed + manufacturer curve -> operating point, NPSH margin, alerts and protective trip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.6",
    "transitions>=0.9.2",
    "pump-analysis-common",
]

[project.scripts]
# Device app (docker)
doover-app-run = "pump_analysis_device:main"
export-config = "pump_analysis_device.app_config:export"
export-ui = "pump_analysis_device.app_ui:export"
# Cloud app (processor)
export-config-processor = "pump_analysis_processor.app_config:export"
export-ui-processor = "pump_analysis_processor.app_ui:export"
# Farm overview dashboard (processor + widget)
export-config-farm = "pump_farm_overview.app_config:export"
export-ui-farm = "pump_farm_overview.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pump_analysis_device", "src/pump_analysis_processor", "src/pump_farm_overview"]

[tool.uv.sources]
pump-analysis-common = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
